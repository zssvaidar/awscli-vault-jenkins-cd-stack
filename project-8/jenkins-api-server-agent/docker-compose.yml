services:
  jenkins-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
      args:
        CACHE_BUST: ${CACHE_BUST}
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./controller/casc_configs:/var/jenkins_home/casc_configs:ro
    networks:
      - jenkins-network

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  jenkins-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        CACHE_BUST: ${CACHE_BUST}
    # image: jenkins/inbound-agent:latest
    container_name: jenkins-agent
    restart: unless-stopped
    group_add:
      - "130"
    environment:
      JENKINS_URL: http://jenkins-controller:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
      JENKINS_WEB_SOCKET: "true"
      VAULT_ADDR: ${VAULT_ADDR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      jenkins-controller:
        condition: service_healthy
    networks:
      - jenkins-network

volumes:
  jenkins_home:

networks:
  jenkins-network:
    driver: bridge
